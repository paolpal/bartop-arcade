<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 514 175" width="514mm" height="175mm">
  <defs>
    <!-- Texture Marrone Cioccolato Tasti C64 -->
    <radialGradient id="deck_bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#463638"/>
      <stop offset="100%" stop-color="#2c2223"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Sfondo Piastra Plancia -->
  <rect width="514" height="175" fill="url(#deck_bg)"/>

  <!-- Bordo guida taglio -->
  <rect x="0.5" y="0.5" width="513" height="174" fill="none" stroke="#5a4548" stroke-width="0.5" stroke-dasharray="3,3"/>

  <!-- Striscia Arcobaleno superiore e inferiore -->
  <g transform="translate(0, 0)">
    <rect x="0" y="0" width="514" height="1.5" fill="#e52521"/>
    <rect x="0" y="1.5" width="514" height="1.5" fill="#f78f1e"/>
    <rect x="0" y="3.0" width="514" height="1.5" fill="#fed100"/>
    <rect x="0" y="4.5" width="514" height="1.5" fill="#43b02a"/>
    <rect x="0" y="6.0" width="514" height="1.5" fill="#00a3e0"/>
  </g>

  <!-- Blocco Schermata Boot C64 in alto al centro -->
  <g transform="translate(257.0, 24)">
    <rect x="-105" y="-12" width="210" height="24" rx="4" fill="#1e1838" stroke="#382e66" stroke-width="1"/>
    <text x="0" y="-3" font-family="'Courier New', monospace" font-size="6.5" font-weight="bold" fill="#7b90ff" text-anchor="middle">**** 2 PLAYERS ARCADE READY. ****</text>
    <text x="0" y="6" font-family="'Courier New', monospace" font-size="5.5" fill="#a4b2ff" text-anchor="middle">SYS 64738 | JOYSTICK CONTROL</text>
  </g>

  <!-- ================= GIOCATORE 1 ================= -->
  <!-- Port 1 Label -->
  <text x="80" y="24" font-family="'Eurostile', sans-serif" font-size="10" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="1">GIOCATORE 1</text>
  <text x="80" y="34" font-family="monospace" font-size="6" fill="#a89a9c" text-anchor="middle">CONTROL PORT 1</text>

  <!-- Joystick 1 Center (d=24) -->
  <circle cx="80" cy="80" r="22" fill="#3a2e30" stroke="#5a4548" stroke-width="1.2"/>
  <circle cx="80" cy="80" r="12" fill="#201a1b" stroke="#e52521" stroke-width="1"/>
  <line x1="60" y1="80" x2="100" y2="80" stroke="#ffffff" stroke-dasharray="1.5,1.5" stroke-width="0.5"/>
  <line x1="80" y1="60" x2="80" y2="100" stroke="#ffffff" stroke-dasharray="1.5,1.5" stroke-width="0.5"/>
  <circle cx="80" cy="80" r="1" fill="#fff"/>
  <text x="80" y="110" font-family="monospace" font-size="6" fill="#a89a9c" text-anchor="middle">JOYSTICK 1 (Ø24)</text>

  <!-- Tasti P1 - Cerchi guida foro d=30 con anelli colorati C64 -->
  <!-- Fila Alta: Rosso, Arancio, Giallo -->
  <circle cx="145" cy="75" r="16.5" fill="#332628" stroke="#e52521" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="145" y="77.5" font-family="sans-serif" font-size="8" font-weight="bold" fill="#fff" text-anchor="middle">A</text>
  <text x="145" y="99" font-family="monospace" font-size="5" fill="#e52521" text-anchor="middle">FIRE 1</text>

  <circle cx="177" cy="83" r="16.5" fill="#332628" stroke="#f78f1e" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="177" y="85.5" font-family="sans-serif" font-size="8" font-weight="bold" fill="#fff" text-anchor="middle">B</text>
  <text x="177" y="107" font-family="monospace" font-size="5" fill="#f78f1e" text-anchor="middle">FIRE 2</text>

  <circle cx="210" cy="78" r="16.5" fill="#332628" stroke="#fed100" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="210" y="80.5" font-family="sans-serif" font-size="8" font-weight="bold" fill="#fff" text-anchor="middle">C</text>

  <!-- Fila Bassa: Verde, Celeste, Viola -->
  <circle cx="145" cy="115" r="16.5" fill="#332628" stroke="#43b02a" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="145" y="117.5" font-family="sans-serif" font-size="8" font-weight="bold" fill="#fff" text-anchor="middle">D</text>

  <circle cx="177" cy="123" r="16.5" fill="#332628" stroke="#00a3e0" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="177" y="125.5" font-family="sans-serif" font-size="8" font-weight="bold" fill="#fff" text-anchor="middle">E</text>

  <circle cx="210" cy="118" r="16.5" fill="#332628" stroke="#9933cc" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="210" y="120.5" font-family="sans-serif" font-size="8" font-weight="bold" fill="#fff" text-anchor="middle">F</text>

  <!-- Tasti Servizio P1 (d=24) -->
  <circle cx="80" cy="30" r="12" fill="#2c2223" stroke="#f8fafc" stroke-width="1.5"/>
  <text x="80" y="32.5" font-family="sans-serif" font-size="6" font-weight="bold" fill="#fff" text-anchor="middle">SELECT</text>

  <circle cx="195" cy="30" r="12" fill="#2c2223" stroke="#fed100" stroke-width="1.5"/>
  <text x="195" y="32.5" font-family="sans-serif" font-size="6" font-weight="bold" fill="#fff" text-anchor="middle">START 1P</text>


  <!-- ================= GIOCATORE 2 ================= -->
  <!-- Port 2 Label -->
  <text x="320" y="24" font-family="'Eurostile', sans-serif" font-size="10" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="1">GIOCATORE 2</text>
  <text x="320" y="34" font-family="monospace" font-size="6" fill="#a89a9c" text-anchor="middle">CONTROL PORT 2</text>

  <!-- Joystick 2 Center (d=24) -->
  <circle cx="320" cy="80" r="22" fill="#3a2e30" stroke="#5a4548" stroke-width="1.2"/>
  <circle cx="320" cy="80" r="12" fill="#201a1b" stroke="#00a3e0" stroke-width="1"/>
  <line x1="300" y1="80" x2="340" y2="80" stroke="#ffffff" stroke-dasharray="1.5,1.5" stroke-width="0.5"/>
  <line x1="320" y1="60" x2="320" y2="100" stroke="#ffffff" stroke-dasharray="1.5,1.5" stroke-width="0.5"/>
  <circle cx="320" cy="80" r="1" fill="#fff"/>
  <text x="320" y="110" font-family="monospace" font-size="6" fill="#a89a9c" text-anchor="middle">JOYSTICK 2 (Ø24)</text>

  <!-- Tasti P2 - Cerchi guida foro d=30 -->
  <!-- Fila Alta: Rosso, Arancio, Giallo -->
  <circle cx="385" cy="75" r="16.5" fill="#332628" stroke="#e52521" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="385" y="77.5" font-family="sans-serif" font-size="8" font-weight="bold" fill="#fff" text-anchor="middle">A</text>
  <text x="385" y="99" font-family="monospace" font-size="5" fill="#e52521" text-anchor="middle">FIRE 1</text>

  <circle cx="417" cy="83" r="16.5" fill="#332628" stroke="#f78f1e" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="417" y="85.5" font-family="sans-serif" font-size="8" font-weight="bold" fill="#fff" text-anchor="middle">B</text>
  <text x="417" y="107" font-family="monospace" font-size="5" fill="#f78f1e" text-anchor="middle">FIRE 2</text>

  <circle cx="450" cy="78" r="16.5" fill="#332628" stroke="#fed100" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="450" y="80.5" font-family="sans-serif" font-size="8" font-weight="bold" fill="#fff" text-anchor="middle">C</text>

  <!-- Fila Bassa: Verde, Celeste, Viola -->
  <circle cx="385" cy="115" r="16.5" fill="#332628" stroke="#43b02a" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="385" y="117.5" font-family="sans-serif" font-size="8" font-weight="bold" fill="#fff" text-anchor="middle">D</text>

  <circle cx="417" cy="123" r="16.5" fill="#332628" stroke="#00a3e0" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="417" y="125.5" font-family="sans-serif" font-size="8" font-weight="bold" fill="#fff" text-anchor="middle">E</text>

  <circle cx="450" cy="118" r="16.5" fill="#332628" stroke="#9933cc" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="450" y="120.5" font-family="sans-serif" font-size="8" font-weight="bold" fill="#fff" text-anchor="middle">F</text>

  <!-- Tasti Servizio P2 (d=24) -->
  <circle cx="320" cy="30" r="12" fill="#2c2223" stroke="#f8fafc" stroke-width="1.5"/>
  <text x="320" y="32.5" font-family="sans-serif" font-size="6" font-weight="bold" fill="#fff" text-anchor="middle">SELECT</text>

  <circle cx="435" cy="30" r="12" fill="#2c2223" stroke="#00a3e0" stroke-width="1.5"/>
  <text x="435" y="32.5" font-family="sans-serif" font-size="6" font-weight="bold" fill="#fff" text-anchor="middle">START 2P</text>
</svg>