<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 514 310" width="514mm" height="310mm">
  <defs>
    <linearGradient id="bezel_tan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cfc0a7"/>
      <stop offset="100%" stop-color="#b3a185"/>
    </linearGradient>
  </defs>

  <!-- Cornice Esterna Monitor Biscottone 1702 -->
  <rect width="514" height="310" fill="url(#bezel_tan)"/>

  <!-- Finestra Ritaglio Schermo (Nera / Trasparente) -->
  <rect x="18" y="20" width="478" height="270" rx="6" fill="#000000" stroke="#36282b" stroke-width="4"/>
  <rect x="15" y="17" width="484" height="276" rx="8" fill="none" stroke="#e2d6c3" stroke-width="1"/>

  <!-- Logo Commodore 1702 in basso a destra -->
  <g transform="translate(334, 288)">
    <rect x="0" y="0" width="140" height="16" rx="2" fill="#2d2224" stroke="#4a373a" stroke-width="0.8"/>
    <text x="10" y="11" font-family="'Eurostile', sans-serif" font-size="7" font-weight="900" fill="#f8fafc">Commodore</text>
    <text x="65" y="11" font-family="'Eurostile', sans-serif" font-size="8" font-weight="900" fill="#fed100">1702</text>
    <text x="92" y="11" font-family="monospace" font-size="5" fill="#cbd5e1">COLOR MONITOR</text>
  </g>

  <!-- Finto sportellino comandi in basso a sinistra (Luminosità, Colore, Tinta) -->
  <g transform="translate(45, 288)">
    <rect x="0" y="0" width="110" height="16" rx="2" fill="#2d2224" stroke="#4a373a" stroke-width="0.8"/>
    <circle cx="20" cy="8" r="4" fill="#4a373a" stroke="#665053" stroke-width="1"/>
    <text x="20" y="16" font-family="monospace" font-size="3.5" fill="#94a3b8" text-anchor="middle">BRIGHT</text>
    <circle cx="55" cy="8" r="4" fill="#4a373a" stroke="#665053" stroke-width="1"/>
    <text x="55" y="16" font-family="monospace" font-size="3.5" fill="#94a3b8" text-anchor="middle">COLOR</text>
    <circle cx="90" cy="8" r="4" fill="#4a373a" stroke="#665053" stroke-width="1"/>
    <text x="90" y="16" font-family="monospace" font-size="3.5" fill="#94a3b8" text-anchor="middle">TINT</text>
  </g>

  <!-- Griglie aerazione laterali tipiche del monitor CRT -->
  <g transform="translate(12, 60)">
    <line x1="0" y1="0" x2="14" y2="0" stroke="#8c785f" stroke-width="2.5" stroke-linecap="round"/><line x1="0" y1="12" x2="14" y2="12" stroke="#8c785f" stroke-width="2.5" stroke-linecap="round"/><line x1="0" y1="24" x2="14" y2="24" stroke="#8c785f" stroke-width="2.5" stroke-linecap="round"/><line x1="0" y1="36" x2="14" y2="36" stroke="#8c785f" stroke-width="2.5" stroke-linecap="round"/><line x1="0" y1="48" x2="14" y2="48" stroke="#8c785f" stroke-width="2.5" stroke-linecap="round"/><line x1="0" y1="60" x2="14" y2="60" stroke="#8c785f" stroke-width="2.5" stroke-linecap="round"/><line x1="0" y1="72" x2="14" y2="72" stroke="#8c785f" stroke-width="2.5" stroke-linecap="round"/><line x1="0" y1="84" x2="14" y2="84" stroke="#8c785f" stroke-width="2.5" stroke-linecap="round"/><line x1="0" y1="96" x2="14" y2="96" stroke="#8c785f" stroke-width="2.5" stroke-linecap="round"/><line x1="0" y1="108" x2="14" y2="108" stroke="#8c785f" stroke-width="2.5" stroke-linecap="round"/><line x1="0" y1="120" x2="14" y2="120" stroke="#8c785f" stroke-width="2.5" stroke-linecap="round"/><line x1="0" y1="132" x2="14" y2="132" stroke="#8c785f" stroke-width="2.5" stroke-linecap="round"/><line x1="0" y1="144" x2="14" y2="144" stroke="#8c785f" stroke-width="2.5" stroke-linecap="round"/><line x1="0" y1="156" x2="14" y2="156" stroke="#8c785f" stroke-width="2.5" stroke-linecap="round"/><line x1="0" y1="168" x2="14" y2="168" stroke="#8c785f" stroke-width="2.5" stroke-linecap="round"/><line x1="0" y1="180" x2="14" y2="180" stroke="#8c785f" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g transform="translate(488, 60)">
    <line x1="0" y1="0" x2="14" y2="0" stroke="#8c785f" stroke-width="2.5" stroke-linecap="round"/><line x1="0" y1="12" x2="14" y2="12" stroke="#8c785f" stroke-width="2.5" stroke-linecap="round"/><line x1="0" y1="24" x2="14" y2="24" stroke="#8c785f" stroke-width="2.5" stroke-linecap="round"/><line x1="0" y1="36" x2="14" y2="36" stroke="#8c785f" stroke-width="2.5" stroke-linecap="round"/><line x1="0" y1="48" x2="14" y2="48" stroke="#8c785f" stroke-width="2.5" stroke-linecap="round"/><line x1="0" y1="60" x2="14" y2="60" stroke="#8c785f" stroke-width="2.5" stroke-linecap="round"/><line x1="0" y1="72" x2="14" y2="72" stroke="#8c785f" stroke-width="2.5" stroke-linecap="round"/><line x1="0" y1="84" x2="14" y2="84" stroke="#8c785f" stroke-width="2.5" stroke-linecap="round"/><line x1="0" y1="96" x2="14" y2="96" stroke="#8c785f" stroke-width="2.5" stroke-linecap="round"/><line x1="0" y1="108" x2="14" y2="108" stroke="#8c785f" stroke-width="2.5" stroke-linecap="round"/><line x1="0" y1="120" x2="14" y2="120" stroke="#8c785f" stroke-width="2.5" stroke-linecap="round"/><line x1="0" y1="132" x2="14" y2="132" stroke="#8c785f" stroke-width="2.5" stroke-linecap="round"/><line x1="0" y1="144" x2="14" y2="144" stroke="#8c785f" stroke-width="2.5" stroke-linecap="round"/><line x1="0" y1="156" x2="14" y2="156" stroke="#8c785f" stroke-width="2.5" stroke-linecap="round"/><line x1="0" y1="168" x2="14" y2="168" stroke="#8c785f" stroke-width="2.5" stroke-linecap="round"/><line x1="0" y1="180" x2="14" y2="180" stroke="#8c785f" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Linea guida taglio esterno -->
  <rect x="0.5" y="0.5" width="513" height="309" fill="none" stroke="#5a4548" stroke-width="0.5" stroke-dasharray="3,3"/>
</svg>